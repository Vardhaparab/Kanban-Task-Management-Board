<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right">
                <div class="nav-btn">
                    <div class="searchdiv">
                        <i id="search-icon" data-lucide="search"  aria-label="Search tasks"></i>
                        <input type="text" id="search-input"  aria-label="Search tasks" placeholder="Search tasks..." />
                        <i id="search-cancel" data-lucide="x"></i>
                    </div>
                    <button id="toggle-modal" aria-haspopup="dialog" aria-controls="add-task-modal">Add New Task</button>
                    <button class="theme" aria-label="Toggle theme"></button>
                </div>
            </div>
        </nav>
        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">📝To do</div>
                    <div class="right">Count</div>
                </div>
            </div>
            <div id="inprogress" class="task-column">
                <div class="heading">
                    <div class="left">⏳In Progress</div>
                    <div class="right">Count</div>
                </div>
                <!--  <div draggable="true" class="task">
                    <div class="task-title">
                       <h2>Task 1</h2>
                       <p>Description for Task 1</p>
                     
                    </div>
                      <button>Delete</button>
                </div> -->
            </div>
            <div id="completed" class="task-column ">
                <div class="heading">
                    <div class="left">✅Completed</div>
                    <div class="right">Count</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal add-new-task">
        <div class="bg"></div>

        <div class="center">
            <button class="close-modal">❌</button>
            <div class="modal-center">
                <label >Title:</label>
                <input type="text" id="task-title-input" placeholder="Task Title" />
                <label>Description:</label>
                <textarea type="text" id="task-desc-input" placeholder="Task Description"></textarea>
                <label for="task-priority-input">Priority:</label>
                <select id="task-priority-input">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <div class="dates">
                    <div id="startDate">
                    <label>Start Date:</label>
                    <input type="date" id="start-date">
                    </div>
                    <div id="dueDate">
                    <label>Due Date:</label>
                     <input type="date" id="due-date">
                     </div>
                </div>
                <button id="add-new-task" class="add-task-btn">Add Task</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>
</body>

</html>
